name: Hent kurser
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC: etter at USA har stengt (21:00 UTC vinter, 20:00 sommer)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml requests
      - run: python fetch.py
      - run: |
          git config user.name "kurs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.csv metrics.csv regime.csv ohlc.csv screen.csv
          git commit -m "Oppdater kurser $(date -u +%F)" || echo "ingen endringer"
          git push
