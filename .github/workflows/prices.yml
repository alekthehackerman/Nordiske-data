name: Hent kurser
on:
  schedule:
    # GitHub forsinker planlagte jobber ofte med timer, særlig på :00 og :30.
    # Derfor flere kjøringer på rare minutter innenfor vinduet da Yahoo har komplette dagsdata
    # (etter at Europa stenger kl. 16:30 UTC og fram mot midnatt UTC).
    - cron: "17 17 * * 1-5"
    - cron: "47 18 * * 1-5"
    - cron: "23 20 * * 1-5"
    - cron: "13 22 * * 1-5"
    - cron: "43 23 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hent-kurser
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml requests
      - run: python fetch.py
      - run: |
          git config user.name "kurs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.csv metrics.csv regime.csv ohlc.csv screen.csv status.csv
          git commit -m "Oppdater kurser $(date -u +%F-%H%M)" || echo "ingen endringer"
          git pull --rebase || true
          git push
