name: Hent kurser
on:
  schedule:
    - cron: "45 17 * * 1-5"   # etter at Europa har stengt
    - cron: "30 21 * * 1-5"   # etter at USA har stengt (21:00 UTC vinter)
    - cron: "30 5 * * 2-6"    # tidlig morgen: fyller eventuelle hull fra natten
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hent-kurser
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml requests
      - run: python fetch.py
      - run: |
          git config user.name "kurs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.csv metrics.csv regime.csv ohlc.csv screen.csv status.csv
          git commit -m "Oppdater kurser $(date -u +%F-%H%M)" || echo "ingen endringer"
          git pull --rebase || true
          git push
